name: Documentation correction
description: Report an unclear or inaccurate statement in the public AROSA documentation
title: "[Docs] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: "For documentation suggestions only. Do not post internal documents or private source excerpts."
  - type: input
    id: page
    attributes:
      label: Public page
      placeholder: README, architecture, roadmap, FAQ...
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What needs to be corrected?
    validations:
      required: true
  - type: textarea
    id: wording
    attributes:
      label: Suggested wording or clarification
