name: Public bug report
description: Share a reproducible AROSA user-facing bug without private diagnostic data
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, unpublished code, private logs or memory dumps. This public tracker is not the internal engineering backlog."
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: AFileManager, ABrowser, workspace, installer...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AROSA version (if known)
      placeholder: e.g. version displayed in About
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x86_64
        - i386
        - Other / unknown
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: public_context
    attributes:
      label: Additional public context (optional)
      description: Screenshots only when they do not reveal private information
